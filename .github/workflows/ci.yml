name: CI

on:
  pull_request:
    branches: [main]
  # Also every push to main: a fix pushed to a branch after its PR merged
  # once reached main without CI (2026-10-06).
  push:
    branches: [main]

# The workflow only reads the repo; give its token nothing more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:db
      - run: npm run test:share
      - run: npm run build
